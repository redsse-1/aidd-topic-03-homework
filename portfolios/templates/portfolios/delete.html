{% extends "dashboard/base.html" %}

{% block title %}
<title>Удаление портфеля</title>
{% endblock %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        <p>Вы уверены, что хотите удалить портфель <b>"{{ portfolio.name }}"</b> вместе с позициями и историей операций?</p>
        <input type="submit" class="btn btn-sm btn-outline-danger rounded-pill" value="Удалить" />
    </form>
{% endblock %}
