{% if portfolios %}
    <div class="mt-2 d-flex flex-wrap gap-2">
        {% for portfolio in portfolios %}
            <a href="{% url 'portfolios:trade' portfolio.pk %}?share={{ share.pk }}&side=buy" class="btn btn-sm btn-outline-primary">Купить в портфель «{{ portfolio.name }}»</a>
        {% endfor %}
    </div>
{% endif %}
