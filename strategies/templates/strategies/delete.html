{% extends "dashboard/base.html" %}

{% block title %}
<title>Удаление стратегии</title>
{% endblock %}

{% block content %}
    <form method="post">
        {% csrf_token %}
        <p>Вы уверены, что хотите удалить стратегию <b>"{{ strategy.name }}"</b> и её журнал операций?</p>
        <input type="submit" class="btn btn-sm btn-outline-danger rounded-pill" value="Удалить" />
    </form>
{% endblock %}
